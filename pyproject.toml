[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devatlas"
version = "1.3.0"
description = "Atlante operativo offline del codice"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.12.0", "Pygments==2.20.0", "snowballstemmer==3.1.1"]

[project.scripts]
devatlas = "devatlas.app:main"

[tool.setuptools.packages.find]
include = ["devatlas*"]

[tool.setuptools.package-data]
devatlas = ["data/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

